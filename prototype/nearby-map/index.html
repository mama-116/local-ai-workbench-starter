<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nearby Map</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body class="bg-gray-100">
<div class="flex items-center gap-2 p-2 bg-white shadow-sm">
  <input id="searchInput" type="text" placeholder="検索..." class="flex-1 px-3 py-2 border rounded" aria-label="施設名で検索">
  <select id="categorySelect" class="px-2 py-2 border rounded" aria-label="カテゴリを選択">
    <option value="all">すべて</option>
    <option value="supermarket">スーパー</option>
    <option value="fuel">ガソリン</option>
  </select>
  <button id="locateBtn" type="button" aria-label="現在地を取得" class="px-3 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">📍 現在地</button>
</div>
<div id="map" class="w-full" style="height: calc(100vh - 120px);"></div>
<div id="infoCard" class="absolute top-2 right-2 bg-white p-2 rounded shadow text-sm z-1000" hidden></div>
<div id="legend" class="absolute bottom-2 left-2 bg-white p-2 rounded shadow text-sm z-1000">
  <div><span class="inline-block w-4 h-4 bg-blue-500 rounded-full"></span> 現在地</div>
  <div><span class="inline-block w-4 h-4 bg-green-500 rounded-full"></span> スーパー</div>
  <div><span class="inline-block w-4 h-4 bg-orange-500 rounded-full"></span> ガソリン</div>
</div>
<div class="flex items-center gap-2 p-2 bg-white shadow-sm">
  <span id="status" class="text-sm text-gray-600">📍 現在地未取得</span>
  <button id="demoBtn" type="button" aria-label="デモ地点で試す" class="px-3 py-2 bg-green-500 text-white rounded hover:bg-green-600">🎯 デモ地点で試す</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
