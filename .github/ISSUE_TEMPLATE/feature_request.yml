name: 機能提案
description: 新機能や改善のアイデアを提案します
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        提案ありがとうございます。解決したいことと利用場面を中心に教えてください。
  - type: textarea
    id: problem
    attributes:
      label: 解決したいこと
      description: 現在どのような点で困っているかを記載してください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望する解決方法
      description: どのような機能や動作を希望するかを記載してください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
      description: 現在の回避策や、ほかに考えた方法があれば記載してください。
  - type: textarea
    id: additional
    attributes:
      label: 補足
      description: 参考資料やモックがあれば記載してください。秘密情報・個人情報は含めないでください。
  - type: checkboxes
    id: safety
    attributes:
      label: 公開情報の確認
      options:
        - label: 秘密情報や個人情報が含まれていないことを確認しました。
          required: true
