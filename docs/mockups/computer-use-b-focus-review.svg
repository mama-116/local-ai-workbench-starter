  <text x="230" y="112" fill="#f2a65a" font-family="Yu Gothic UI,sans-serif" font-size="11" font-weight="700">実行前の安全確認</text><text x="230" y="148" fill="#e8e4dc" font-family="Yu Gothic UI,sans-serif" font-size="25" font-weight="700">この計画だけを実行します</text><text x="938" y="116" fill="#f2a65a" font-family="Yu Gothic UI,sans-serif" font-size="12">残り 24秒</text>
  <rect x="230" y="182" width="410" height="274" rx="16" fill="#171816"/><text x="252" y="212" fill="#716d65" font-family="Yu Gothic UI,sans-serif" font-size="9">計画</text><text x="252" y="242" fill="#e8e4dc" font-family="Yu Gothic UI,sans-serif" font-size="14" font-weight="700">隔離Windows VM / メモ帳</text><text x="252" y="278" fill="#969188" font-family="Yu Gothic UI,sans-serif" font-size="11">1. 固定プロファイルでメモ帳を起動</text><text x="252" y="306" fill="#969188" font-family="Yu Gothic UI,sans-serif" font-size="11">2. UIAで編集領域を一意確認</text><text x="252" y="334" fill="#969188" font-family="Yu Gothic UI,sans-serif" font-size="11">3. 次の全文を入力し、保存せず停止</text><rect x="252" y="354" width="366" height="58" rx="10" fill="#272822"/><text x="270" y="389" fill="#e8e4dc" font-family="Yu Gothic UI,sans-serif" font-size="13">安全確認 2026-07-18</text><text x="252" y="438" fill="#969188" font-family="Yu Gothic UI,sans-serif" font-size="10">3操作 · 最大60秒 · ハッシュ 8b7d…31ac</text>
  <rect x="664" y="182" width="386" height="274" rx="16" fill="#18231f"/><text x="686" y="212" fill="#716d65" font-family="Yu Gothic UI,sans-serif" font-size="9">実行できる理由</text><text x="686" y="246" fill="#55c2a3" font-family="Yu Gothic UI,sans-serif" font-size="12">✓ 標準権限・同一ユーザー</text><text x="686" y="278" fill="#55c2a3" font-family="Yu Gothic UI,sans-serif" font-size="12">✓ 同一対話セッション</text><text x="686" y="310" fill="#55c2a3" font-family="Yu Gothic UI,sans-serif" font-size="12">✓ ネットワーク / 共有なし</text><text x="686" y="342" fill="#55c2a3" font-family="Yu Gothic UI,sans-serif" font-size="12">✓ 保存・削除・設定変更なし</text><line x1="686" y1="368" x2="1024" y2="368" stroke="#3b4741"/><text x="686" y="397" fill="#ff9b9b" font-family="Yu Gothic UI,sans-serif" font-size="11" font-weight="700">許可しない: Host / 管理者 / UAC / 任意操作</text><text x="686" y="426" fill="#e8e4dc" font-family="Yu Gothic UI,sans-serif" font-size="11">停止: Ctrl + Alt + F12</text>
  <rect x="230" y="494" width="820" height="52" rx="12" fill="#3a1717"/><text x="252" y="526" fill="#ffb0b0" font-family="Yu Gothic UI,sans-serif" font-size="12">計画が1文字でも変わると、この承認は失効します。失敗時は自動再開しません。</text>
